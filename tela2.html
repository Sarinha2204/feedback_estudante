<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tela2.css">
    <title>Avaliação do Docente</title>
</head>
<body>
    
    <nav class="nav">
        <div class="nav-container">
            <a class="col">
                <img class="img_escola" src="escola_JT.png" alt="logo JT">
                <h3 class="texto">AVALIAÇÃO DO DOCENTE</h3>
            </a>
            <div class="profile-section">
                <img class="profile-img" src="profile-placeholder.png" alt="Foto do usuário" id="userProfileImg">
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="greeting-section">
            <h2 class="greeting">Olá, <span id="userName">Raiany Vitoria Prado Mendes</span>!</h2>
        </div>

        <div class="cards-container">
            <div class="year-card card-disabled">
                <div class="card-header">
                    <h3 class="year-title">1º ANO</h3>
                    <p class="year-subtitle">ENSINO MÉDIO</p>
                </div>
                <div class="card-content">
                    <div class="year-info">
                        <span class="year-number">[1]</span>
                        <span class="year-details">1º ano A - 2023</span>
                    </div>
                    <button class="card-button disabled" disabled>Indisponível</button>
                </div>
            </div>

            <div class="year-card card-disabled">
                <div class="card-header">
                    <h3 class="year-title">2º ANO</h3>
                    <p class="year-subtitle">ENSINO MÉDIO</p>
                </div>
                <div class="card-content">
                    <div class="year-info">
                        <span class="year-number">[2]</span>
                        <span class="year-details">2º ano A - 2024</span>
                    </div>
                    <button class="card-button disabled" disabled>Indisponível</button>
                </div>
            </div>

            <div class="year-card card-active">
                <div class="card-header">
                    <h3 class="year-title">3º ANO</h3>
                    <p class="year-subtitle">ENSINO MÉDIO</p>
                </div>
                <div class="card-content">
                    <div class="year-info">
                        <span class="year-number">[3]</span>
                        <span class="year-details">3º ano A - 2025</span>
                    </div>
                    <button class="card-button active" onclick="accessYear(3)">Acessar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
